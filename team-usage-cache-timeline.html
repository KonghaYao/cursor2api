      --accent2: #f59e42;
      --grid: #2a3548;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--grid);
      background: linear-gradient(180deg, #15202b 0%, var(--bg) 100%);
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.9rem; }
    main { padding: 1rem 1.5rem 2rem; max-width: 1280px; margin: 0 auto; }
    .chart-wrap {
      background: var(--panel);
      border: 1px solid var(--grid);
      border-radius: 12px;
      padding: 1rem 1rem 0.5rem;
      margin-bottom: 1rem;
    }
    .legend-note {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0.5rem 0 0;
      padding: 0 0.25rem 0.75rem;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--grid);
      border-radius: 10px;
      padding: 0.75rem 1rem;
    }
    .stat .k { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat .v { font-size: 1.25rem; font-weight: 600; margin-top: 0.15rem; }
    canvas { max-height: 420px; }
    .toggle {
      margin: 0.5rem 0 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .toggle button {
      background: var(--panel);
      border: 1px solid var(--grid);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .toggle button.active {
      border-color: var(--accent);
      background: #1e3a5f;
    }
  </style>
</head>

    const hits = DATA.map(d => d.hit);
  hits.sort((a,b) => a-b);
  const med = hits[Math.floor(hits.length/2)];
  const avg = hits.reduce((a,b)=>a+b,0)/hits.length;
  document.getElementById('stats').innerHTML = [
    ['请求数', DATA.length],
    ['平均命中率', avg.toFixed(1) + '%'],
    ['中位命中率', med.toFixed(1) + '%'],
    ['时间起点', DATA[0].t.slice(11,19) + ' UTC'],
    ['时间终点', DATA[DATA.length-1].t.slice(11,19) + ' UTC'],
  ].map(([k,v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

  const commonX = {
    type: 'time',
    time: { unit: 'minute', displayFormats: { minute: 'HH:mm' } },
    title: { display: true, text: '时间 (UTC)', color: '#8b9cb3' },
    grid: { color: '#2a3548' },
    ticks: { color: '#8b9cb3', maxRotation: 0 }
  };

  let chart, chartCost;
  let showRaw = true, showRoll = true;

  function buildHitChart() {
    const datasets = [];
    if (showRaw) datasets.push({
      label: '单次命中率 %',
      data: DATA.map(d => ({ x: d.t, y: d.hit })),
      borderColor: 'rgba(61, 156, 245, 0.35)',
      backgroundColor: 'rgba(61, 156, 245, 0.08)',
      borderWidth: 1,
      pointRadius: 0,
      pointHitRadius: 6,
      tension: 0.1,
      order: 2
    });
    if (showRoll) datasets.push({
      label: '21 次滚动中位 %',
      data: DATA.map(d => ({ x: d.t, y: d.hit_roll })),
      borderColor: '#f59e42',
      backgroundColor: 'transparent',
      borderWidth: 2.5,
      pointRadius: 0,
      tension: 0.35,
      order: 1
    });

    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: { datasets },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: '#e7ecf3' } },
          tooltip: {
            callbacks: {
              afterLabel(ctx) {
                const i = ctx.dataIndex;
                const d = DATA[i];
                if (!d) return '';
                return [d.model, 'tokens: ' + d.tokens.toLocaleString(), 'cost: $' + d.cost.toFixed(2)];
              }
            }
          }
        },
        scales: {
          x: commonX,
          y: {
            min: 0,
            max: 100,
            title: { display: true, text: '缓存命中率 %', color: '#8b9cb3' },
            grid: { color: '#2a3548' },
            ticks: { color: '#8b9cb3', callback: v => v + '%' }
          }
        }
      }
    });
  }

  chartCost = new Chart(document.getElementById('chartCost'), {
    type: 'line',
    data: {
      datasets: [{
        label: '单次 Cost (USD)',
        data: DATA.map(d => ({ x: d.t, y: d.cost })),
        borderColor: '#a78bfa',
        backgroundColor: 'rgba(167, 139, 250, 0.15)',
        fill: true,
        borderWidth: 1,
        pointRadius: 0,
        tension: 0.1
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#e7ecf3' } } },
      scales: {
        x: commonX,
        y: {
          min: 0,
          title: { display: true, text: 'Cost ($)', color: '#8b9cb3' },
          grid: { color: '#2a3548' },
          ticks: { color: '#8b9cb3', callback: v => '$' + v.toFixed(2) }
        }
      }
    }
  });

  buildHitChart();

  document.querySelectorAll('.toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const m = btn.dataset.mode;
      showRaw = m === 'both' || m === 'raw';
      showRoll = m === 'both' || m === 'roll';
      buildHitChart();
    });
  });
  </script>
